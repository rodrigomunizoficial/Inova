name: Deploy (FTP)

# Envia o site para a hospedagem por FTP. Só roda quando alguém clica em
# "Run workflow" na aba Actions do GitHub.
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#   FTP_SERVER    ex.: ftp.inovasaude.com.br
#   FTP_USERNAME  usuário FTP do cPanel
#   FTP_PASSWORD  senha desse usuário
#   FTP_DIR       pasta de destino, terminando em "/" (ex.: public_html/ ou public_html/sistema/)
#
# Arquivos que já existem no servidor e não fazem parte deste repositório não são apagados.
# inc/config.php não está no Git: crie-o uma vez direto no servidor.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar PHP
        run: for f in $(git ls-files '*.php'); do php -l "$f"; done

      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            inc/config.php
